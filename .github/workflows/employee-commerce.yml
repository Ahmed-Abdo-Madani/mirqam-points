name: Prepare employee commerce safely
on:
  push:
    branches: [codex/hq-loyalty-sso]
    paths: [.github/workflows/employee-commerce.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirqam_points_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hq-loyalty-sso
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply additive commerce changes
        shell: bash
        run: |
          node --input-type=module <<'PATCH'
          import fs from 'node:fs';
          function change(p,a,b){let s=fs.readFileSync(p,'utf8');if(!s.includes(a))throw new Error('Missing anchor '+p+' '+a);fs.writeFileSync(p,s.replace(a,b))}
          fs.writeFileSync('apps/api/src/commerce.js',"import { HttpError } from './http.js'\nconst BASE = 'https://mirqam.sa/m/ad0ed94a6a279f02a1295ae283efa07d2c18/commerce/loyalty/'\nexport function createCommerceClient({ key = process.env.MIRQAM_COMMERCE_KEY || '', fetcher = fetch } = {}) {\n  const enabled = /^[a-f0-9]{64}$/.test(key)\n  async function call(action, body) {\n    if (!enabled) throw new HttpError(503, 'billing_unavailable')\n    let r, data\n    try {\n      r = await fetcher(BASE + action, { method: 'POST', redirect: 'error', headers: { authorization: 'Bearer ' + key, 'content-type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(5000) })\n      data = await r.json()\n    } catch { throw new HttpError(503, 'billing_unavailable') }\n    if (!r.ok) throw new HttpError(r.status >= 500 ? 503 : 400, r.status >= 500 ? 'billing_unavailable' : 'coupon_invalid')\n    return data\n  }\n  return { enabled, async quote(body) {\n    const q = await call('quote', body)\n    if (!/^[a-f0-9]{64}$/.test(q.id || '') || q.platform !== 'loyalty' || q.orderRef !== body.orderRef || q.accountRef !== body.accountRef || q.currency !== 'SAR' || q.subtotalMinor !== body.subtotalMinor || !Number.isSafeInteger(q.discountMinor) || q.discountMinor < 0 || q.amountMinor !== body.subtotalMinor - q.discountMinor || q.amountMinor < 100 || !Number.isFinite(q.expiresAt) || q.expiresAt <= Date.now()) throw new HttpError(502, 'billing_payment_mismatch')\n    return q\n  }, async confirm(event) {\n    const receipt = await call('confirm', event)\n    if (receipt.id !== event.quoteId || receipt.paymentRef !== event.paymentRef) throw new HttpError(502, 'billing_payment_mismatch')\n    return receipt\n  } }\n}\nexport function paymentEvent(row, payment, live) {\n  if (!row.commerce_quote) return null\n  const paidAt = payment.captured_at || payment.updated_at\n  if (!live || payment.live === false || payment.test === true || !/^[a-zA-Z0-9_.:-]{1,160}$/.test(payment.id || '') || !Number.isFinite(Date.parse(paidAt))) return null\n  return { quoteId: row.commerce_quote.id, orderRef: row.id, accountRef: row.tenant_id, paymentRef: payment.id, status: 'paid', live: true, currency: 'SAR', amountMinor: row.amount, paidAt: new Date(paidAt).toISOString() }\n}\nexport function startCommerceWorker(billing) {\n  if (!billing.commerceEnabled) return () => {}\n  let busy = false\n  const run = async () => { if (busy) return; busy = true; try { await billing.reconcileCommerce() } catch { console.error('commerce_reconcile_failed') } finally { busy = false } }\n  const timer = setInterval(run, 60000); timer.unref(); void run()\n  return () => clearInterval(timer)\n}\n");
          fs.writeFileSync('apps/api/migrations/009-employee-commerce.sql',"-- Staff attribution is additive; existing checkouts keep their original amounts and behavior.\nALTER TABLE subscription_checkouts ADD COLUMN coupon_code text NOT NULL DEFAULT '';\nALTER TABLE subscription_checkouts ADD COLUMN commerce_quote jsonb;\nALTER TABLE subscription_checkouts ADD COLUMN commerce_event jsonb;\nALTER TABLE subscription_checkouts ADD COLUMN commerce_state text NOT NULL DEFAULT 'none' CHECK (commerce_state IN ('none','awaiting_payment','pending','delivered','review'));\nALTER TABLE subscription_checkouts ADD COLUMN commerce_next_at timestamptz NOT NULL DEFAULT now();\nALTER TABLE subscription_checkouts ADD COLUMN commerce_attempts integer NOT NULL DEFAULT 0;\nCREATE INDEX subscription_commerce_due ON subscription_checkouts(commerce_next_at) WHERE commerce_state IN ('awaiting_payment','pending');\n");
          change("apps/api/src/billing.js","import { HttpError } from './http.js'","import { randomUUID } from 'node:crypto'\nimport { createCommerceClient, paymentEvent } from './commerce.js'\nimport { HttpError } from './http.js'");
          change("apps/api/src/billing.js","createBilling({ db, config, fetcher = fetch })","createBilling({ db, config, fetcher = fetch, commerce = createCommerceClient() })");
          change("apps/api/src/billing.js","async function checkout(tenantId, cycle, requestKey) {","function couponCode(value) {\n if (typeof value !== 'string' || value.length > 40) throw new HttpError(400,'coupon_invalid');\n const code=value.trim().toUpperCase();\n if(code && !/^[A-Z0-9_-]{3,40}$/.test(code))throw new HttpError(400,'coupon_invalid');\n return code;\n}\nasync function quote(tenantId,cycle,coupon,orderRef) {\n if(!Object.hasOwn(PRICES,cycle))throw new HttpError(400,'validation_failed');\n return commerce.quote({orderRef,accountRef:tenantId,plan:'loyalty',cycle,currency:'SAR',subtotalMinor:PRICES[cycle],coupon,referral:''});\n}\nasync function preview(tenantId,cycle,value) {\n const coupon=couponCode(value);\n if(!coupon)throw new HttpError(400,'coupon_invalid');\n const q=await quote(tenantId,cycle,coupon,randomUUID());\n return {subtotalMinor:q.subtotalMinor,discountMinor:q.discountMinor,amountMinor:q.amountMinor,currency:'SAR'};\n}\nasync function checkout(tenantId, cycle, requestKey, value = '') {\n const coupon=couponCode(value);");
          change("apps/api/src/billing.js","if (row && row.cycle !== cycle)","if (row && (row.cycle !== cycle || row.coupon_code !== coupon))");
          change("apps/api/src/billing.js","AND cycle=$2 AND status='pending' AND created_at","AND cycle=$2 AND coupon_code=$3 AND (commerce_quote IS NULL OR (commerce_quote->>'expiresAt')::numeric > extract(epoch from now())*1000) AND status='pending' AND created_at");
          change("apps/api/src/billing.js","[tenantId, cycle],","[tenantId, cycle, coupon],");
          change("apps/api/src/billing.js","      row = (\n        await tx.query('INSERT INTO subscription_checkouts(tenant_id,request_key,cycle,amount) VALUES($1,$2,$3,$4) RETURNING *', [\n          tenantId,\n          requestKey,\n          cycle,\n          PRICES[cycle],\n        ])\n      ).rows[0]","      const id=randomUUID();\n      const q=coupon ? await quote(tenantId,cycle,coupon,id) : null;\n      row=(await tx.query('INSERT INTO subscription_checkouts(id,tenant_id,request_key,cycle,amount,coupon_code,commerce_quote,commerce_state) VALUES($1,$2,$3,$4,$5,$6,$7,$8) RETURNING *',[id,tenantId,requestKey,cycle,q?.amountMinor ?? PRICES[cycle],coupon,q?JSON.stringify(q):null,q?'awaiting_payment':'none'])).rows[0]");
          change("apps/api/src/billing.js","new Date(Date.now() + 86400000).toISOString()","new Date(row.commerce_quote?.expiresAt || Date.now() + 86400000).toISOString()");
          change("apps/api/src/billing.js","      return (\n        await tx.query(\"UPDATE subscription_checkouts SET status='paid'","      if(row.commerce_quote) {\n        const event=paymentEvent(row,payment,key.startsWith('sk_live_'));\n        await tx.query('UPDATE subscription_checkouts SET commerce_event=$1,commerce_state=$2,commerce_next_at=now() WHERE id=$3 AND tenant_id=$4',[event?JSON.stringify(event):null,event?'pending':'review',checkoutId,tenantId]);\n      }\n      return (\n        await tx.query(\"UPDATE subscription_checkouts SET status='paid'");
          change("apps/api/src/billing.js","  return {\n    ready,","  async function reconcileCommerce() {\n    if(!commerce.enabled)return;\n    const awaiting=(await db.query(\"SELECT id,tenant_id FROM subscription_checkouts WHERE commerce_state='awaiting_payment' AND commerce_next_at<=now() AND created_at>now()-interval '2 days' ORDER BY commerce_next_at LIMIT 10\")).rows;\n    for(const row of awaiting) {\n      await db.query(\"UPDATE subscription_checkouts SET commerce_next_at=now()+interval '5 minutes' WHERE id=$1 AND tenant_id=$2\",[row.id,row.tenant_id]);\n      try {await confirm(row.tenant_id,row.id)}catch{/* Provider failure is retried without changing a subscription. */}\n    }\n    const pending=(await db.query(\"SELECT id,tenant_id,commerce_event FROM subscription_checkouts WHERE commerce_state='pending' AND commerce_next_at<=now() ORDER BY commerce_next_at LIMIT 20\")).rows;\n    for(const row of pending) {\n      await db.query(\"UPDATE subscription_checkouts SET commerce_attempts=commerce_attempts+1,commerce_next_at=now()+interval '5 minutes' WHERE id=$1 AND tenant_id=$2\",[row.id,row.tenant_id]);\n      try {\n        await commerce.confirm(row.commerce_event);\n        await db.query(\"UPDATE subscription_checkouts SET commerce_state='delivered' WHERE id=$1 AND tenant_id=$2 AND commerce_state='pending'\",[row.id,row.tenant_id]);\n      }catch{/* Durable outbox retries the same payment identity. */}\n    }\n  }\n  return {\n    commerceEnabled:commerce.enabled,\n    preview,\n    reconcileCommerce,\n    ready,");
          change("apps/api/src/billing.js","        prices: PRICES,","        commerceEnabled:commerce.enabled,\n        prices: PRICES,");
          change("apps/api/src/routes/billing.js","  r.post('/checkout',","  r.post('/quote', rateLimit({windowMs:60000,limit:20}), async(req,res)=>res.json(await billing.preview(req.auth.tenantId,req.body.cycle,req.body.coupon)))\n  r.post('/checkout',");
          change("apps/api/src/routes/billing.js","req.body.cycle, idempotencyKey(req))","req.body.cycle, idempotencyKey(req), req.body.coupon)");
          change("apps/api/src/app.js","  app.use('/api/billing', billingRoutes(createBilling({ db, config })))","  app.locals.billing=createBilling({db,config})\n  app.use('/api/billing', billingRoutes(app.locals.billing))");
          change("apps/api/src/server.js","import { createApp } from './app.js'","import { createApp } from './app.js'\nimport { startCommerceWorker } from './commerce.js'");
          change("apps/api/src/server.js","const server = app.listen","const stopCommerce=startCommerceWorker(app.locals.billing)\nconst server = app.listen");
          change("apps/api/src/server.js","  server.close()","  stopCommerce()\n  server.close()");
          fs.writeFileSync('apps/api/src/commerce.test.js',"import { randomUUID } from 'node:crypto'\nimport { afterAll,beforeAll,expect,it,vi } from 'vitest'\nimport { createBilling } from './billing.js'\nimport { createCommerceClient,paymentEvent } from './commerce.js'\nimport { freshDb,seedTenant } from './testing.js'\nlet db,a,b,service,invoice,fetcher,commerce\nbeforeAll(async()=>{\n db=await freshDb();a=await seedTenant(db);b=await seedTenant(db);\n commerce={enabled:true,quote:vi.fn(async body=>{\n  if(body.coupon!=='STAFF10')throw Object.assign(new Error('coupon_invalid'),{status:400});\n  return {...body,id:'a'.repeat(64),platform:'loyalty',discountMinor:Math.round(body.subtotalMinor/10),amountMinor:body.subtotalMinor-Math.round(body.subtotalMinor/10),expiresAt:Date.now()+86400000};\n }),confirm:vi.fn(async()=>({ok:true}))};\n fetcher=vi.fn(async(_url,options)=>{\n  if(options.method==='POST'){\n   const body=JSON.parse(options.body);const id=randomUUID();\n   invoice={id,amount:body.amount,currency:'SAR',url:'https://checkout.moyasar.com/invoices/'+id,payments:[]};\n  }\n  return {ok:true,json:async()=>structuredClone(invoice)};\n });\n service=createBilling({db,config:{production:true,moyasarSecretKey:'sk_live_fixture',publicUrl:'https://example.invalid'},fetcher,commerce});\n});\nafterAll(async()=>{await db?.close()});\nit('rejects invalid coupon before issuing an invoice',async()=>{\n await expect(service.checkout(a.tenantId,'monthly','invalid-coupon','INVALID')).rejects.toMatchObject({status:400});\n expect(fetcher).not.toHaveBeenCalled();\n});\nit('discounts exact invoice, isolates tenants, queues verified payment once and retries delivery',async()=>{\n const row=await service.checkout(a.tenantId,'monthly','staff-order','STAFF10');\n expect(row.amount).toBe(6210);expect(row.commerce_state).toBe('awaiting_payment');\n expect((await service.checkout(a.tenantId,'monthly','staff-order','STAFF10')).id).toBe(row.id);\n await expect(service.checkout(a.tenantId,'monthly','staff-order','OTHER')).rejects.toMatchObject({status:409});\n await expect(service.confirm(b.tenantId,row.id)).rejects.toMatchObject({status:404});\n await service.confirm(a.tenantId,row.id);expect(commerce.confirm).not.toHaveBeenCalled();\n invoice.payments=[{id:randomUUID(),invoice_id:invoice.id,status:'paid',amount:6210,currency:'SAR',refunded:0,updated_at:new Date().toISOString()}];\n await service.confirm(a.tenantId,row.id);\n let saved=(await db.query('SELECT * FROM subscription_checkouts WHERE id=$1',[row.id])).rows[0];\n expect(saved.commerce_state).toBe('pending');expect(saved.commerce_event.amountMinor).toBe(6210);\n const expires=(await service.status(a.tenantId)).subscription.expires_at;\n commerce.confirm.mockRejectedValueOnce(new Error('offline'));\n await service.reconcileCommerce();\n saved=(await db.query('SELECT * FROM subscription_checkouts WHERE id=$1',[row.id])).rows[0];expect(saved.commerce_state).toBe('pending');\n await db.query('UPDATE subscription_checkouts SET commerce_next_at=now() WHERE id=$1',[row.id]);\n await service.reconcileCommerce();await service.confirm(a.tenantId,row.id);await service.reconcileCommerce();\n expect(commerce.confirm).toHaveBeenCalledTimes(2);expect((await service.status(a.tenantId)).subscription.expires_at).toEqual(expires);\n saved=(await db.query('SELECT * FROM subscription_checkouts WHERE id=$1',[row.id])).rows[0];expect(saved.commerce_state).toBe('delivered');\n});\nit('does not report test or unprovable payments as real sales',()=>{\n const row={commerce_quote:{id:'a'.repeat(64)},id:'order',tenant_id:'tenant',amount:6210};\n expect(paymentEvent(row,{id:'pay',updated_at:new Date().toISOString()},false)).toBeNull();\n expect(paymentEvent(row,{id:'pay',live:false,updated_at:new Date().toISOString()},true)).toBeNull();\n expect(paymentEvent(row,{id:'pay'},true)).toBeNull();\n});\nit('central client fails closed on tampered prices and mismatched receipts',async()=>{\n const q={orderRef:'o',accountRef:'a',subtotalMinor:6900};\n const client=createCommerceClient({key:'a'.repeat(64),fetcher:async()=>({ok:true,json:async()=>({quote:{...q,id:'a'.repeat(64),platform:'loyalty',currency:'SAR',discountMinor:690,amountMinor:6900,expiresAt:Date.now()+10000},receipt:{id:'wrong'}})})});\n await expect(client.quote(q)).rejects.toMatchObject({status:502});\n await expect(client.confirm({quoteId:'q',paymentRef:'p'})).rejects.toMatchObject({status:502});\n});\n");
          change("apps/web/src/pages/app/Billing.jsx","import { Button, Card, Skeleton }","import { Button, Card, Input, Skeleton }");
          change("apps/web/src/pages/app/Billing.jsx","  const checkout =","  const [coupon,setCoupon]=useState(''),[applied,setApplied]=useState(''),[quotes,setQuotes]=useState(null)\n  const checkout =");
          change("apps/web/src/pages/app/Billing.jsx","  async function subscribe(cycle) {","  async function applyCoupon() {\n const code=coupon.trim().toUpperCase();setBusy(true);setFailure(null);setQuotes(null);setApplied('');\n try {const pairs=await Promise.all(['monthly','yearly'].map(async cycle=>[cycle,await api('/billing/quote',{method:'POST',body:{cycle,coupon:code}})]));setQuotes(Object.fromEntries(pairs));setApplied(code)}catch(e){setFailure(e)}finally{setBusy(false)}\n }\n async function subscribe(cycle) {");
          change("apps/web/src/pages/app/Billing.jsx","body: { cycle },","body: { cycle, coupon:coupon.trim().toUpperCase() },");
          change("apps/web/src/pages/app/Billing.jsx","            <div className=\"mt-6 grid gap-4 sm:grid-cols-2\">","            {data.commerceEnabled && <Card title={t('billing.coupon')} className=\"mt-6\">\n <Input label={t('billing.coupon')} value={coupon} maxLength={40} disabled={busy} onChange={e=>{setCoupon(e.target.value);setQuotes(null);setApplied('')}} />\n <Button disabled={busy || !coupon.trim()} onClick={applyCoupon}>{t('billing.applyCoupon')}</Button>\n {quotes && <p role=\"status\">{t('billing.couponApplied')}</p>}\n </Card>}\n            <div className=\"mt-6 grid gap-4 sm:grid-cols-2\">");
          change("apps/web/src/pages/app/Billing.jsx","{data.prices[cycle] / 100}","{(quotes?.[cycle]?.amountMinor ?? data.prices[cycle]) / 100}");
          change("apps/web/src/pages/app/Billing.jsx","                  <Button disabled={busy || !data.ready}","                  {quotes?.[cycle] && <p className=\"mb-4\">{t('billing.discount')}: {quotes[cycle].discountMinor/100} {t('billing.sar')}</p>}\n                  <Button disabled={busy || !data.ready || (!!coupon.trim() && applied !== coupon.trim().toUpperCase())}");
          change("apps/web/src/i18n/ar.js","  billing: {","  billing: {\n    coupon: \"كود الخصم\",\n    applyCoupon: \"تطبيق الكود\",\n    couponApplied: \"تم تطبيق الخصم. راجع السعر قبل الدفع.\",\n    discount: \"الخصم\",");
          change("apps/web/src/i18n/ar.js","  errors: {","  errors: {\n    coupon_invalid:\"الكوبون غير صالح لهذه الباقة أو انتهت صلاحيته.\",");
          change("apps/web/src/i18n/en.js","  billing: {","  billing: {\n    coupon: \"Discount code\",\n    applyCoupon: \"Apply code\",\n    couponApplied: \"Discount applied. Review the price before paying.\",\n    discount: \"Discount\",");
          change("apps/web/src/i18n/en.js","  errors: {","  errors: {\n    coupon_invalid:\"The coupon is invalid for this plan or has expired.\",");
          
          PATCH
      - name: Format changed files
        run: npx biome check --write apps/api/src/commerce.js apps/api/src/commerce.test.js apps/api/src/billing.js apps/api/src/routes/billing.js apps/api/src/app.js apps/api/src/server.js apps/web/src/pages/app/Billing.jsx apps/web/src/i18n/ar.js apps/web/src/i18n/en.js
      - name: Full PGlite gate
        run: node scripts/verify.mjs
      - name: Full PostgreSQL gate
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirqam_points_test
          VERIFY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirqam_points_test
        run: node scripts/verify.mjs
      - name: Publish tested changes to the same branch
        run: |
          git config user.name 'Mirqam CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api apps/web
          git commit -m 'Connect loyalty employee coupons to verified payments and durable attribution'
          git push origin HEAD:codex/hq-loyalty-sso
