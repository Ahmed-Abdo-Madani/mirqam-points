name: Verify loyalty staff referrals
on:
  push:
    branches: [codex/staff-referrals]
    paths: [.github/workflows/staff-referrals.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirqam_points_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/staff-referrals
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply additive commerce changes
        shell: bash
        run: |
          node --input-type=module <<'PATCH'
          import fs from 'node:fs';
          fs.writeFileSync("apps/api/src/billing.js","import { randomUUID } from 'node:crypto'\nimport { createCommerceClient, paymentEvent } from './commerce.js'\nimport { HttpError } from './http.js'\nexport const PRICES = Object.freeze({ monthly: 6900, yearly: 69000 })\nconst uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i\nexport function createBilling({ db, config, fetcher = fetch, commerce = createCommerceClient() }) {\n  const key = config.moyasarSecretKey || ''\n  const ready = config.production ? key.startsWith('sk_live_') : /^sk_(live|test)_/.test(key)\n  async function request(path, body) {\n    if (!ready) throw new HttpError(503, 'billing_unavailable')\n    let res\n    try {\n      res = await fetcher(`https://api.moyasar.com/v1/${path}`, {\n        method: body ? 'POST' : 'GET',\n        headers: { authorization: `Basic ${Buffer.from(`${key}:`).toString('base64')}`, 'content-type': 'application/json' },\n        ...(body ? { body: JSON.stringify(body) } : {}),\n        signal: AbortSignal.timeout(15000),\n      })\n    } catch {\n      throw new HttpError(502, 'billing_provider_error')\n    }\n    if (!res.ok) throw new HttpError(502, 'billing_provider_error')\n    try {\n      return await res.json()\n    } catch {\n      throw new HttpError(502, 'billing_provider_error')\n    }\n  }\n  function couponCode(value) {\n    if (typeof value !== 'string' || value.length > 40) throw new HttpError(400, 'coupon_invalid')\n    const code = value.trim().toUpperCase()\n    if (code && !/^[A-Z0-9_-]{3,40}$/.test(code)) throw new HttpError(400, 'coupon_invalid')\n    return code\n  }\n  async function quote(tenantId, cycle, coupon, orderRef, referral = '') {\n    if (!Object.hasOwn(PRICES, cycle)) throw new HttpError(400, 'validation_failed')\n    return commerce.quote({ orderRef, accountRef: tenantId, plan: 'loyalty', cycle, currency: 'SAR', subtotalMinor: PRICES[cycle], coupon, referral })\n  }\n  async function preview(tenantId, cycle, value) {\n    const coupon = couponCode(value)\n    if (!coupon) throw new HttpError(400, 'coupon_invalid')\n    const q = await quote(tenantId, cycle, coupon, randomUUID())\n    return { subtotalMinor: q.subtotalMinor, discountMinor: q.discountMinor, amountMinor: q.amountMinor, currency: 'SAR' }\n  }\n  async function checkout(tenantId, cycle, requestKey, value = '', referralValue = '') {\n    const coupon = couponCode(value)\n    const referral = /^[a-f0-9]{32}$/.test(referralValue) ? referralValue : ''\n    if (!Object.hasOwn(PRICES, cycle)) throw new HttpError(400, 'validation_failed')\n    if (!ready) throw new HttpError(503, 'billing_unavailable')\n    // Serialize creation for this tenant, including retries with the same key.\n    return db.tx(async (tx) => {\n      await tx.query('SELECT id FROM tenants WHERE id=$1 FOR UPDATE', [tenantId])\n      let row = (await tx.query('SELECT * FROM subscription_checkouts WHERE tenant_id=$1 AND request_key=$2', [tenantId, requestKey])).rows[0]\n      if (row && (row.cycle !== cycle || row.coupon_code !== coupon || (row.commerce_quote?.referral || '') !== referral)) throw new HttpError(409, 'billing_request_conflict')\n      if (row?.checkout_url) return row\n      // Reuse an unpaid invoice to avoid duplicate invoices on rapid clicks.\n      if (!row)\n        row = (\n          await tx.query(\n            \"SELECT * FROM subscription_checkouts WHERE tenant_id=$1 AND cycle=$2 AND coupon_code=$3 AND COALESCE(commerce_quote->>'referral','')=$4 AND (commerce_quote IS NULL OR (commerce_quote->>'expiresAt')::numeric > extract(epoch from now())*1000) AND status='pending' AND created_at > now() - interval '23 hours' ORDER BY created_at DESC LIMIT 1\",\n            [tenantId, cycle, coupon, referral],\n          )\n        ).rows[0]\n      if (row?.checkout_url) return row\n      const id = randomUUID()\n      const q = coupon || referral ? await quote(tenantId, cycle, coupon, id, referral) : null\n      row = (\n        await tx.query(\n          'INSERT INTO subscription_checkouts(id,tenant_id,request_key,cycle,amount,coupon_code,commerce_quote,commerce_state) VALUES($1,$2,$3,$4,$5,$6,$7,$8) RETURNING *',\n          [id, tenantId, requestKey, cycle, q?.amountMinor ?? PRICES[cycle], coupon, q ? JSON.stringify(q) : null, q ? 'awaiting_payment' : 'none'],\n        )\n      ).rows[0]\n      const invoice = await request('invoices', {\n        amount: row.amount,\n        currency: 'SAR',\n        description: `Mirqam Loyalty ${cycle} subscription (VAT included)`,\n        success_url: `${config.publicUrl}/app/billing?checkout=${row.id}`,\n        back_url: `${config.publicUrl}/app/billing`,\n        callback_url: `${config.publicUrl}/api/billing/moyasar/webhook`,\n        expired_at: new Date(row.commerce_quote?.expiresAt || Date.now() + 86400000).toISOString(),\n        metadata: { checkout_id: row.id, tenant_id: tenantId, product: 'mirqam-loyalty' },\n      })\n      let url\n      try {\n        url = new URL(invoice.url)\n      } catch {\n        throw new HttpError(502, 'billing_provider_error')\n      }\n      if (\n        url.protocol !== 'https:' ||\n        url.hostname !== 'checkout.moyasar.com' ||\n        !uuid.test(invoice.id) ||\n        invoice.amount !== row.amount ||\n        invoice.currency !== 'SAR'\n      )\n        throw new HttpError(502, 'billing_provider_error')\n      return (\n        await tx.query('UPDATE subscription_checkouts SET invoice_id=$1,checkout_url=$2 WHERE id=$3 AND tenant_id=$4 RETURNING *', [\n          invoice.id,\n          url.href,\n          row.id,\n          tenantId,\n        ])\n      ).rows[0]\n    })\n  }\n  async function confirm(tenantId, checkoutId) {\n    if (!uuid.test(checkoutId)) throw new HttpError(400, 'validation_failed')\n    const row = (await db.query('SELECT * FROM subscription_checkouts WHERE tenant_id=$1 AND id=$2', [tenantId, checkoutId])).rows[0]\n    if (!row) throw new HttpError(404, 'not_found')\n    if (row.status === 'paid') return row\n    const invoice = await request(`invoices/${encodeURIComponent(row.invoice_id)}`)\n    if (invoice.id !== row.invoice_id || invoice.amount !== row.amount || invoice.currency !== 'SAR') throw new HttpError(409, 'billing_payment_mismatch')\n    const payment = invoice.payments?.find(\n      (p) => p.status === 'paid' && p.invoice_id === row.invoice_id && p.amount === row.amount && p.currency === 'SAR' && !p.refunded,\n    )\n    if (!payment) return row\n    return db.tx(async (tx) => {\n      await tx.query('SELECT id FROM tenants WHERE id=$1 FOR UPDATE', [tenantId])\n      const locked = (await tx.query('SELECT * FROM subscription_checkouts WHERE tenant_id=$1 AND id=$2 FOR UPDATE', [tenantId, checkoutId])).rows[0]\n      if (locked.status === 'paid') return locked\n      await tx.query(\n        `INSERT INTO subscriptions(tenant_id,cycle,expires_at) VALUES($1,$2,now()+make_interval(months=>$3))\n        ON CONFLICT(tenant_id) DO UPDATE SET cycle=EXCLUDED.cycle, expires_at=GREATEST(subscriptions.expires_at,now())+make_interval(months=>$3),updated_at=now()`,\n        [tenantId, row.cycle, row.cycle === 'yearly' ? 12 : 1],\n      )\n      if (row.commerce_quote) {\n        const event = paymentEvent(row, payment, key.startsWith('sk_live_'))\n        await tx.query('UPDATE subscription_checkouts SET commerce_event=$1,commerce_state=$2,commerce_next_at=now() WHERE id=$3 AND tenant_id=$4', [\n          event ? JSON.stringify(event) : null,\n          event ? 'pending' : 'review',\n          checkoutId,\n          tenantId,\n        ])\n      }\n      return (\n        await tx.query(\"UPDATE subscription_checkouts SET status='paid',payment_id=$1,paid_at=now() WHERE id=$2 AND tenant_id=$3 RETURNING *\", [\n          payment.id,\n          checkoutId,\n          tenantId,\n        ])\n      ).rows[0]\n    })\n  }\n  async function reconcileCommerce() {\n    if (!commerce.enabled) return\n    const awaiting = (\n      await db.query(\n        \"SELECT id,tenant_id FROM subscription_checkouts WHERE commerce_state='awaiting_payment' AND commerce_next_at<=now() AND created_at>now()-interval '2 days' ORDER BY commerce_next_at LIMIT 10\",\n      )\n    ).rows\n    for (const row of awaiting) {\n      await db.query(\"UPDATE subscription_checkouts SET commerce_next_at=now()+interval '5 minutes' WHERE id=$1 AND tenant_id=$2\", [row.id, row.tenant_id])\n      try {\n        await confirm(row.tenant_id, row.id)\n      } catch {\n        /* Provider failure is retried without changing a subscription. */\n      }\n    }\n    const pending = (\n      await db.query(\n        \"SELECT id,tenant_id,commerce_event FROM subscription_checkouts WHERE commerce_state='pending' AND commerce_next_at<=now() ORDER BY commerce_next_at LIMIT 20\",\n      )\n    ).rows\n    for (const row of pending) {\n      await db.query(\n        \"UPDATE subscription_checkouts SET commerce_attempts=commerce_attempts+1,commerce_next_at=now()+interval '5 minutes' WHERE id=$1 AND tenant_id=$2\",\n        [row.id, row.tenant_id],\n      )\n      try {\n        await commerce.confirm(row.commerce_event)\n        await db.query(\"UPDATE subscription_checkouts SET commerce_state='delivered' WHERE id=$1 AND tenant_id=$2 AND commerce_state='pending'\", [\n          row.id,\n          row.tenant_id,\n        ])\n      } catch {\n        /* Durable outbox retries the same payment identity. */\n      }\n    }\n  }\n  return {\n    commerceEnabled: commerce.enabled,\n    preview,\n    reconcileCommerce,\n    ready,\n    checkout,\n    confirm,\n    async status(tenantId) {\n      return {\n        ready,\n        commerceEnabled: commerce.enabled,\n        prices: PRICES,\n        currency: 'SAR',\n        vatIncluded: true,\n        subscription: (await db.query('SELECT cycle,expires_at,expires_at>now() AS active FROM subscriptions WHERE tenant_id=$1', [tenantId])).rows[0] || null,\n      }\n    },\n    async webhook(body) {\n      const invoiceId = body?.type ? body?.data?.invoice_id : body?.id\n      if (typeof invoiceId !== 'string' || !uuid.test(invoiceId)) return\n      const row = (await db.query('SELECT id,tenant_id FROM subscription_checkouts WHERE invoice_id=$1', [invoiceId])).rows[0]\n      if (row) await confirm(row.tenant_id, row.id)\n    },\n  }\n}");
          fs.writeFileSync("apps/api/src/routes/billing.js","import { Router } from 'express'\nimport rateLimit from 'express-rate-limit'\nimport { requireAuth, requireRole } from '../auth.js'\nimport { idempotencyKey } from '../http.js'\nexport default function billingRoutes(billing) {\n  const r = Router()\n  r.post('/moyasar/webhook', rateLimit({ windowMs: 60000, limit: 120 }), async (req, res) => {\n    await billing.webhook(req.body)\n    res.json({ ok: true })\n  })\n  r.use(requireAuth, requireRole('owner'))\n  r.get('/', async (req, res) => res.json(await billing.status(req.auth.tenantId)))\n  r.post('/quote', rateLimit({ windowMs: 60000, limit: 20 }), async (req, res) =>\n    res.json(await billing.preview(req.auth.tenantId, req.body.cycle, req.body.coupon)),\n  )\n  r.post('/checkout', rateLimit({ windowMs: 60000, limit: 10 }), async (req, res) => {\n    const c = await billing.checkout(req.auth.tenantId, req.body.cycle, idempotencyKey(req), req.body.coupon, String(req.headers.cookie || '').match(/(?:^|;\\s*)__Secure-mirqam-ref-loyalty=([a-f0-9]{32})(?:;|$)/)?.[1] || '')\n    res.json({ id: c.id, url: c.checkout_url, status: c.status })\n  })\n  r.post('/checkout/:id/confirm', rateLimit({ windowMs: 60000, limit: 30 }), async (req, res) => {\n    const c = await billing.confirm(req.auth.tenantId, req.params.id)\n    res.json({ status: c.status })\n  })\n  return r\n}");
          fs.writeFileSync("apps/api/src/commerce.test.js","import { randomUUID } from 'node:crypto'\nimport { afterAll, beforeAll, expect, it, vi } from 'vitest'\nimport { createBilling } from './billing.js'\nimport { createCommerceClient, paymentEvent } from './commerce.js'\nimport { freshDb, seedTenant } from './testing.js'\n\nlet db, a, b, service, invoice, fetcher, commerce\nbeforeAll(async () => {\n  db = await freshDb()\n  a = await seedTenant(db)\n  b = await seedTenant(db)\n  commerce = {\n    enabled: true,\n    quote: vi.fn(async (body) => {\n      if (body.coupon !== 'STAFF10' && !(body.coupon === '' && /^[a-f0-9]{32}$/.test(body.referral))) throw Object.assign(new Error('coupon_invalid'), { status: 400 })\n      return {\n        ...body,\n        id: 'a'.repeat(64),\n        platform: 'loyalty',\n        discountMinor: (body.coupon ? Math.round(body.subtotalMinor / 10) : 0),\n        amountMinor: body.subtotalMinor - (body.coupon ? Math.round(body.subtotalMinor / 10) : 0),\n        expiresAt: Date.now() + 86400000,\n      }\n    }),\n    confirm: vi.fn(async () => ({ ok: true })),\n  }\n  fetcher = vi.fn(async (_url, options) => {\n    if (options.method === 'POST') {\n      const body = JSON.parse(options.body)\n      const id = randomUUID()\n      invoice = { id, amount: body.amount, currency: 'SAR', url: 'https://checkout.moyasar.com/invoices/' + id, payments: [] }\n    }\n    return { ok: true, json: async () => structuredClone(invoice) }\n  })\n  service = createBilling({ db, config: { production: true, moyasarSecretKey: 'sk_live_fixture', publicUrl: 'https://example.invalid' }, fetcher, commerce })\n})\nafterAll(async () => {\n  await db?.close()\n})\nit('rejects invalid coupon before issuing an invoice', async () => {\n  await expect(service.checkout(a.tenantId, 'monthly', 'invalid-coupon', 'INVALID')).rejects.toMatchObject({ status: 400 })\n  expect(fetcher).not.toHaveBeenCalled()\n})\nit('discounts exact invoice, isolates tenants, queues verified payment once and retries delivery', async () => {\n  const row = await service.checkout(a.tenantId, 'monthly', 'staff-order', 'STAFF10')\n  expect(row.amount).toBe(6210)\n  expect(row.commerce_state).toBe('awaiting_payment')\n  expect((await service.checkout(a.tenantId, 'monthly', 'staff-order', 'STAFF10')).id).toBe(row.id)\n  await expect(service.checkout(a.tenantId, 'monthly', 'staff-order', 'OTHER')).rejects.toMatchObject({ status: 409 })\n  await expect(service.confirm(b.tenantId, row.id)).rejects.toMatchObject({ status: 404 })\n  await service.confirm(a.tenantId, row.id)\n  expect(commerce.confirm).not.toHaveBeenCalled()\n  invoice.payments = [\n    { id: randomUUID(), invoice_id: invoice.id, status: 'paid', amount: 6210, currency: 'SAR', refunded: 0, updated_at: new Date().toISOString() },\n  ]\n  await service.confirm(a.tenantId, row.id)\n  let saved = (await db.query('SELECT * FROM subscription_checkouts WHERE id=$1', [row.id])).rows[0]\n  expect(saved.commerce_state).toBe('pending')\n  expect(saved.commerce_event.amountMinor).toBe(6210)\n  const expires = (await service.status(a.tenantId)).subscription.expires_at\n  commerce.confirm.mockRejectedValueOnce(new Error('offline'))\n  await service.reconcileCommerce()\n  saved = (await db.query('SELECT * FROM subscription_checkouts WHERE id=$1', [row.id])).rows[0]\n  expect(saved.commerce_state).toBe('pending')\n  await db.query('UPDATE subscription_checkouts SET commerce_next_at=now() WHERE id=$1', [row.id])\n  await service.reconcileCommerce()\n  await service.confirm(a.tenantId, row.id)\n  await service.reconcileCommerce()\n  expect(commerce.confirm).toHaveBeenCalledTimes(2)\n  expect((await service.status(a.tenantId)).subscription.expires_at).toEqual(expires)\n  saved = (await db.query('SELECT * FROM subscription_checkouts WHERE id=$1', [row.id])).rows[0]\n  expect(saved.commerce_state).toBe('delivered')\n})\nit('does not report test or unprovable payments as real sales', () => {\n  const row = { commerce_quote: { id: 'a'.repeat(64) }, id: 'order', tenant_id: 'tenant', amount: 6210 }\n  expect(paymentEvent(row, { id: 'pay', updated_at: new Date().toISOString() }, false)).toBeNull()\n  expect(paymentEvent(row, { id: 'pay', live: false, updated_at: new Date().toISOString() }, true)).toBeNull()\n  expect(paymentEvent(row, { id: 'pay' }, true)).toBeNull()\n})\nit('central client fails closed on tampered prices and mismatched receipts', async () => {\n  const q = { orderRef: 'o', accountRef: 'a', subtotalMinor: 6900 }\n  const client = createCommerceClient({\n    key: 'a'.repeat(64),\n    fetcher: async () => ({\n      ok: true,\n      json: async () => ({\n        quote: { ...q, id: 'a'.repeat(64), platform: 'loyalty', currency: 'SAR', discountMinor: 690, amountMinor: 6900, expiresAt: Date.now() + 10000 },\n        receipt: { id: 'wrong' },\n      }),\n    }),\n  })\n  await expect(client.quote(q)).rejects.toMatchObject({ status: 502 })\n  await expect(client.confirm({ quoteId: 'q', paymentRef: 'p' })).rejects.toMatchObject({ status: 502 })\n})\nit('attributes referral-only payment at full price without double delivery', async () => {\n const referral='c'.repeat(32),before=commerce.confirm.mock.calls.length\n const row=await service.checkout(b.tenantId,'monthly','referral-order','',referral)\n expect(row.amount).toBe(6900)\n expect(row.commerce_quote.referral).toBe(referral)\n expect((await service.checkout(b.tenantId,'monthly','referral-order','',referral)).id).toBe(row.id)\n await expect(service.checkout(b.tenantId,'monthly','referral-order','','d'.repeat(32))).rejects.toMatchObject({status:409})\n invoice.payments=[{id:randomUUID(),invoice_id:invoice.id,status:'paid',amount:6900,currency:'SAR',refunded:0,updated_at:new Date().toISOString()}]\n await service.confirm(b.tenantId,row.id)\n await service.reconcileCommerce()\n await service.confirm(b.tenantId,row.id)\n await service.reconcileCommerce()\n expect(commerce.confirm.mock.calls.length-before).toBe(1)\n expect((await db.query('SELECT commerce_state FROM subscription_checkouts WHERE id=$1',[row.id])).rows[0].commerce_state).toBe('delivered')\n})\n");
          PATCH
      - name: Format changed files
        run: npx biome check --write apps/api/src/billing.js apps/api/src/routes/billing.js apps/api/src/commerce.test.js
      - name: Full PGlite gate
        run: node scripts/verify.mjs
      - name: Full PostgreSQL gate
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirqam_points_test
          VERIFY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirqam_points_test
        run: node scripts/verify.mjs
      - name: Publish tested changes to the same branch
        run: |
          git config user.name 'Mirqam CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api apps/web
          git commit -m 'Attribute referral-only loyalty checkouts after verified payment'
          git push origin HEAD:codex/staff-referrals
