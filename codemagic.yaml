# Codemagic CI — native builds of the Mirqam Points merchant app.
# Prerequisite (one-time, Codemagic UI → Team settings → Integrations →
# Developer Portal): an App Store Connect API key named "Mirqam ASC".
# The key must be created by the Account Holder or an Admin (Team key).
workflows:
  ios-app-store:
    name: iOS — TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mirqam ASC
    environment:
      node: 22
      xcode: latest
      vars:
        APP_STORE_APPLE_ID: 6821140365
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'ios-v*'
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile && npx cap sync ios
      - name: Create/fetch signing files and apply them
        script: |
          # ios_signing only *fetches* existing profiles; this creates the distribution
          # certificate + App Store profile through the "Mirqam ASC" API key when missing.
          # Optional: set a secure CERTIFICATE_PRIVATE_KEY var (RSA PEM) to reuse one
          # distribution certificate across builds (Apple allows only a few).
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cm_dist_key -q -N ""
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cm_dist_key)"
          fi
          keychain initialize
          app-store-connect fetch-signing-files "sa.mirqam.points" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd apps/mobile/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --project "apps/mobile/ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-apk:
    name: Android — signed APK/AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      android_signing:
        - mirqam_points_upload   # keystore reference uploaded in Codemagic (code signing identities)
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle and sync Android project
        script: |
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile && npx cap sync android
      - name: Write keystore.properties from Codemagic signing
        script: |
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build APK and AAB
        script: cd apps/mobile/android && ./gradlew assembleRelease bundleRelease
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.apk
      - apps/mobile/android/app/build/outputs/**/*.aab

  verify-ios-icon:
    name: Verify and build iOS icon update
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Run full isolated verification gate
        script: node scripts/verify.mjs
      - name: Build mobile bundle and sync iOS
        script: |
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile && npx cap sync ios
      - name: Validate app icon
        script: |
          sips -g pixelWidth -g pixelHeight -g hasAlpha apps/mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Compile iOS simulator app without signing
        script: |
          set -o pipefail
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build/verify-ios CODE_SIGNING_ALLOWED=NO build | tee ios-verify.log
    artifacts:
      - build/verify-ios/Build/Products/Release-iphonesimulator/*.app
      - ios-verify.log
