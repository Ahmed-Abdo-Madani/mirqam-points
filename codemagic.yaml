# Manual free-M2 iOS release using the dedicated Mirqam Codemagic identity.
workflows:
  ios-app-store:
    name: Points signed iOS upload
    max_build_duration: 35
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mirqam Codemagic Upload
    environment:
      node: 22
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - mirqam-points-app-store
        certificates:
          - mirqam-codemagic-ios-distribution
      vars:
        APP_STORE_APPLE_ID: "6821140365"
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Run the complete repository verification gate
        script: node scripts/verify.mjs
      - name: Build mobile bundle and sync iOS
        script: |
          set -euo pipefail
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile
          npx cap sync ios
      - name: Apply the dedicated provisioning profile
        script: |
          set -euo pipefail
          cd apps/mobile/ios/App
          xcode-project use-profiles
      - name: Sign and verify the new Points IPA
        script: |
          set -euo pipefail
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          NEXT=$(python3 -c 'import re,sys;v=sys.argv[1].strip();assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}",v);print(int(v.split(".")[0])+1)' "$LATEST")
          test "$NEXT" -le 9999
          xcode-project build-ipa --project apps/mobile/ios/App/App.xcodeproj --scheme App --config Release --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$NEXT MARKETING_VERSION=1.1.0 DEVELOPMENT_TEAM=L8MHB4V9AW"
          python3 -c 'import glob,zipfile,plistlib,sys;files=glob.glob("build/ios/ipa/*.ipa");assert len(files)==1;z=zipfile.ZipFile(files[0]);paths=[n for n in z.namelist() if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/")==2];assert len(paths)==1;info=plistlib.loads(z.read(paths[0]));assert info["CFBundleIdentifier"]=="sa.mirqam.points";assert info["CFBundleShortVersionString"]=="1.1.0";assert info["CFBundleVersion"]==sys.argv[1];print("Points signed IPA identity and version verified")' "$NEXT"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-apk:
    name: Android — signed APK/AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      android_signing:
        - mirqam_points_upload   # keystore reference uploaded in Codemagic (code signing identities)
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle and sync Android project
        script: |
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile && npx cap sync android
      - name: Write keystore.properties from Codemagic signing
        script: |
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build APK and AAB
        script: cd apps/mobile/android && ./gradlew assembleRelease bundleRelease
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.apk
      - apps/mobile/android/app/build/outputs/**/*.aab

  verify-ios-icon:
    name: Verify and build iOS icon update
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Run full isolated verification gate
        script: node scripts/verify.mjs
      - name: Build mobile bundle and sync iOS
        script: |
          npm run build:mobile -w @mirqam-points/web
          cd apps/mobile && npx cap sync ios
      - name: Validate app icon
        script: |
          sips -g pixelWidth -g pixelHeight -g hasAlpha apps/mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Compile iOS simulator app without signing
        script: |
          set -o pipefail
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build/verify-ios CODE_SIGNING_ALLOWED=NO build | tee ios-verify.log
    artifacts:
      - build/verify-ios/Build/Products/Release-iphonesimulator/*.app
      - ios-verify.log
