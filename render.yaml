# Render blueprint — Mirqam Points (points.mirqam.sa).
# Lives in the SAME Render account as Mirqam Bot so every Mirqam product is
# managed from one dashboard (PLAN.md §3).
#
# Region: oregon, the same region as mirqam-bot. Internal Postgres connection
# strings only resolve inside one region, and future service-to-service calls
# to the bot (WhatsApp notifications) stay on the private network.
services:
  - type: web
    name: mirqam-points
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # DNS: CNAME points -> mirqam-points.onrender.com in the mirqam.sa zone.
    # Render provisions TLS automatically once DNS resolves.
    domains:
      - points.mirqam.sa
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mirqam-points-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://points.mirqam.sa
      # Render terminates TLS in front of the service: trust one proxy hop so
      # req.protocol / client IPs (rate limiting) are correct.
      - key: TRUST_PROXY
        value: '1'

databases:
  # The name MUST stay unique in the Render workspace: blueprint sync matches
  # databases BY NAME. `mirqam-db` (Frankfurt) is the main website's and
  # `mirqam-bot-db` is the bot's — never reuse either.
  - name: mirqam-points-db
    region: oregon
    plan: 0.1c-256mb
    databaseName: mirqam_points
    user: mirqam_points
    postgresMajorVersion: '16'
    diskSizeGB: 1
